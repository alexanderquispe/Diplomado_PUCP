[project]
name = "diplomado-pucp-python"
version = "2026.1"
description = "Fundamentos de Python para Ciencias Sociales y Gestion Publica — Diplomado PUCP"
requires-python = "==3.12.*"

# Base: lo que necesita cualquier sesion del curso
dependencies = [
  "pandas>=2.2,<3",
  "numpy>=1.26,<3",
  "openpyxl>=3.1",
  "pyreadstat>=1.2",
  "jupyterlab>=4",
  "ipykernel>=6.29",
  "ipywidgets>=8.1",
  "plotly>=5.24",
  "nbformat>=5.10",
  "huggingface-hub>=0.26",
  # pip no lo usa uv, pero deja que funcione `%pip install` dentro de un notebook
  "pip>=25",
]

# Extras por tema. Instalar solo el que toca:  uv sync --group mapas
[dependency-groups]
scraping = [
  "requests>=2.32",
  "beautifulsoup4>=4.12",
  "lxml>=5",
  "html5lib>=1.1",
  "selenium>=4.20",
  "webdriver-manager>=4",
]
ia = [
  "anthropic>=0.40",
  "python-dotenv>=1.0",
]
mapas = [
  "geopandas>=1.0",
  "matplotlib>=3.8",
  "folium>=0.17",
  "mapclassify>=2.6",
  "pyogrio>=0.9",
  "shapely>=2.0",
  "branca>=0.7",
]
dashboard = [
  "streamlit>=1.38",
]
dev = [
  "nbstripout>=0.7",
  "ruff>=0.6",
]
