[project]
name = "diplomado-pucp-python"
version = "2026.1"
description = "Fundamentos de Python para Ciencias Sociales y Gestion Publica — Diplomado PUCP"
requires-python = "==3.12.*"

# Base: lo que necesita cualquier sesion del curso
dependencies = [
  "pandas>=2.2,<3",
  "numpy>=1.26,<3",
  "openpyxl>=3.1",
  "pyreadstat>=1.2",
  "jupyterlab>=4",
  "ipykernel>=6.29",
  "ipywidgets>=8.1",
  "plotly>=5.24",
  "nbformat>=5.10",
  "huggingface-hub>=0.26",
  # pip no lo usa uv, pero deja que funcione `%pip install` dentro de un notebook
  "pip>=25",
]

# Extras por tema. Instalar solo el que toca:  uv sync --group mapas
[dependency-groups]
scraping = [
  "requests>=2.32",
  "beautifulsoup4>=4.12",
  "lxml>=5",
  "html5lib>=1.1",
  "selenium>=4.20",
  "webdriver-manager>=4",
]
ia = [
  "anthropic>=0.40",
  "python-dotenv>=1.0",
]
mapas = [
  "geopandas>=1.0",
  "matplotlib>=3.8",
  "folium>=0.17",
  "mapclassify>=2.6",
  "pyogrio>=0.9",
  "shapely>=2.0",
  "branca>=0.7",
]
dashboard = [
  "streamlit>=1.38",
]

# --- Python Intermedio: sesiones 07-raster a 12-despliegue-evaluacion ---------
# Cada grupo trae TODO lo que importan los notebooks de su sesion, para que
# baste con un solo `uv sync --group <grupo>`.
raster = [
  {include-group = "mapas"},
  "rasterio>=1.3",
  "rasterstats>=0.21",
  "seaborn>=0.13",
  "statsmodels>=0.14",
  "scikit-learn>=1.5",
  "pyproj>=3.6",
  "requests>=2.32",
]
llm = [
  "anthropic>=0.40",
  "openai>=1.50",
  "google-genai>=1.0",
  "chromadb>=0.5",
  "sentence-transformers>=3",
  "transformers>=4.48",
  "torch>=2.4",
  "tiktoken>=0.8",
  "pypdf>=5",
  # <1: los labs usan rutas que LangChain 1.0 elimino (langchain.text_splitter)
  "langchain>=0.3,<1",
  "langchain-text-splitters>=0.3",
  "deep-translator>=1.11",
  "python-dotenv>=1.0",
  "scikit-learn>=1.5",
  "matplotlib>=3.8",
  "tqdm>=4.66",
  "requests>=2.32",
]
hf = [
  "transformers>=4.48",
  "datasets>=3",
  "torch>=2.4",
  "accelerate>=1",
  "evaluate>=0.4",
  "scikit-learn>=1.5",
  "matplotlib>=3.8",
  "seaborn>=0.13",
  "soundfile>=0.12",
  "pymupdf>=1.24",
  "tweepy>=4.14",
  "openai>=1.50",
  "tqdm>=4.66",
  "requests>=2.32",
]
docai = [
  "pillow>=10",
  "pymupdf>=1.24",
  "anthropic>=0.40",
  "openai>=1.50",
  "python-dotenv>=1.0",
  "faster-whisper>=1.0",
  "pyannote-audio>=3.3",
  "sounddevice>=0.5",
  "scipy>=1.13",
  "torch>=2.4",
  "torchvision>=0.19",
  "transformers>=4.48",
  "matplotlib>=3.8",
  "requests>=2.32",
]
agents = [
  "crewai>=0.80",
  "crewai-tools>=0.17",
  # <1: lecture-crewai usa rutas que LangChain 1.0 elimino (langchain.chat_models, .memory...)
  "langchain>=0.3,<1",
  "langchain-community>=0.3,<1",
  "langchain-openai>=0.2,<1",
  "openapi-pydantic>=0.5",
  "mcp>=1.0",
  "openai>=1.50",
  "pymupdf>=1.24",
  "panel>=1.4",
  "wikipedia>=1.4",
  "streamlit>=1.38",
  "requests>=2.32",
]
deploy = [
  {include-group = "dashboard"},
  "fastapi>=0.115",
  "uvicorn>=0.30",
]

dev = [
  "nbstripout>=0.7",
  "ruff>=0.6",
]

[tool.uv]
# Sin esta restriccion, uv elige langchain-core 0.4.0.dev0 (una version de
# desarrollo) aunque exista la estable 0.3.x que piden todos los paquetes.
constraint-dependencies = ["langchain-core>=0.3.85,<0.4"]
